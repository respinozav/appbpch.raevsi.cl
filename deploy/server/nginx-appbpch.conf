# ==============================================================================
# Configuración Nginx para appbpch.raevsi.cl
# Servidor: AWS EC2 Ubuntu
# Ubicación física en servidor: /var/www/appbpch.raevsi.cl
# ==============================================================================

# Redirección HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name appbpch.raevsi.cl;

    # Permitir validación de Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name appbpch.raevsi.cl;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/appbpch.raevsi.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appbpch.raevsi.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs específicos del dominio
    access_log /var/log/nginx/appbpch.raevsi.cl.access.log combined;
    error_log /var/log/nginx/appbpch.raevsi.cl.error.log warn;

    # Directorio raíz del frontend (React / Vite)
    root /var/www/appbpch.raevsi.cl/frontend/dist;
    index index.html;

    # Seguridad y cabeceras generales
    client_max_body_size 25M;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión GZIP
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Enrutamiento SPA Frontend (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché para activos estáticos compilados
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy inverso para Backend API (FastAPI en puerto 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Documentación Swagger / OpenAPI
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
